name: Deploy STRYFEBOOLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -R index.html site.css site.js art-sources.json assets _site/
          mkdir -p _site/STRYFE_assets
          cp -R STRYFE_assets/wide_16x9 STRYFE_assets/portrait_4x5 STRYFE_assets/SOURCES_AND_RIGHTS.json _site/STRYFE_assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"               --jq 'any(.artifacts[]; .expired == false)' | grep -qx true; then
              exit 0
            fi
            sleep 5
          done
          echo "The GitHub Pages artifact did not become visible."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
